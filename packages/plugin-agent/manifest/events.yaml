# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点
plugin: dsh-plugin-agent
events:
  - name: agent.registered / agent.onlined
    mode: emit
    description: 注册与上线
  - name: agent.offlined
    mode: emit
    description: 下线（authn 吊销凭证、通知绑定用户）
  - name: mcp.invoked / skill.deprecated
    mode: on
    description: 订阅：归集指标 / 存量引用告警
