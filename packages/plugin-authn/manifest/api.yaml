# OpenAPI 摘要（REST + 工具 + 服务键）—— CLI/Skill/Web 三端对齐的唯一事实源
plugin: dsh-plugin-authn
base: /api
endpoints:
  - POST /api/auth/login · POST /api/auth/sso · POST /api/auth/client-credentials
  - GET /api/auth/me · POST /api/auth/logout
  - GET/POST /api/authn/principals · PATCH /api/authn/principals/:id（scopes 调整，联动吊销令牌）
  - POST /api/authn/principals/:id/disable|enable|rotate-secret（轮换：旧值即废，新值仅一次返回）
  - GET/POST /api/authn/tokens · DELETE /api/authn/tokens/:jti · POST /api/authn/rotate-secret
  - POST /api/authn/entry-tickets/redeem（公开：平台授权直达一次性入场票据兑换身份，#entry_ticket 协作）
tools:
  - authn_token_issue
  - authn_token_revoke
  - authn_token_list
  - authn_credential_create
  - authn_credential_scopes
  - authn_credential_rotate
services:
  - key: authn
    access: ctx.authn
    description: 双轨身份（人/机器）+ 令牌签发校验吊销 + on-behalf-of act 链
  - key: entryTickets
    access: ctx.entryTickets
    description: 平台授权直达 entry-ticket（一次性 + 短时 + 审计留痕，agent/app 通用）
