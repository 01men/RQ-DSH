# OpenAPI 摘要（REST + 工具 + 服务键）—— CLI/Skill/Web 三端对齐的唯一事实源
plugin: dsh-plugin-platform-core
base: /api
endpoints:
  - # 平台自身无业务 REST 页面；behavior 采集面如下（console 聚合面见 console 清单）
  - POST /api/behavior/events（行为采集 write-only：公开挂载于 console 鉴权之后，行为层再校验主体，双层 fail-closed） · GET /api/behavior/events（读取：主体权限校验）

services:
  - key: opsStorage
    access: ctx.opsStorage
    description: JSON 集合存储（原子落盘，可替换 DB）
  - key: platformBus
    access: ctx.platformBus
    description: 平台事件总线（插件协作唯一胶水）
  - key: tools
    access: ctx.tools
    description: ToolRuntime-lite（独立宿主；dsh 下由原生 ToolRuntime 提供）
  - key: httpServer
    access: ctx.httpServer
    description: HTTP 服务：REST 路由 + 静态资源
  - key: scenegraphs
    access: ctx.scenegraphs
    description: 行业场景图谱装载（一图四清单；lint 与运行时同校验器，scenegraph.updated 热刷新）
