# OpenAPI 摘要（REST + 工具 + 服务键）—— CLI/Skill/Web 三端对齐的唯一事实源
plugin: dsh-plugin-platform-core
base: /api
endpoints:
  - POST /api/behavior/events（前端行为埋点采集，write-only；iam 鉴权 fail-closed，主体强制取认证身份）
  - GET /api/behavior/events（行为事件查询，audit.read 门禁；审计/看板订阅面）
  - # 其余业务 REST 仍由 console 插件聚合暴露

services:
  - key: opsStorage
    access: ctx.opsStorage
    description: JSON 集合存储（原子落盘，可替换 DB）
  - key: platformBus
    access: ctx.platformBus
    description: 平台事件总线（插件协作唯一胶水）
  - key: tools
    access: ctx.tools
    description: ToolRuntime-lite（独立宿主；dsh 下由原生 ToolRuntime 提供）
  - key: httpServer
    access: ctx.httpServer
    description: HTTP 服务：REST 路由 + 静态资源
  - key: behavior
    access: ctx.behavior
    description: 行为事件管道（behavior.recorded 先写后发/幂等/死信/重放，WP-03/D3）
