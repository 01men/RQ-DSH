# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点
plugin: dsh-plugin-platform-core
events:
  - name: tools/change
    mode: emit
    description: 工具注册变更（lite 运行时）
  - name: scenegraph.updated
    mode: emit
    description: 行业场景图谱重载完成（部门面板热刷新）
  - name: bus.listener_error
    mode: emit
    description: 总线监听器异常（OPT-P1-04：重试后入死信，审计可查）
  - name: bus.dead_letter
    mode: emit
    description: 总线死信入账告警（支持人工重投 retryDeadLetters）
