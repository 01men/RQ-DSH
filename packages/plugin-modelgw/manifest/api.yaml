# OpenAPI 摘要（REST + 工具 + 服务键）—— CLI/Skill/Web 三端对齐的唯一事实源
plugin: dsh-plugin-modelgw
base: /api
endpoints:
  - # REST 面由 console 聚合暴露（见 console 清单 modelgw.* 各条）；工具面如下
tools:
  - model_list
services:
  - key: modelGateway
    access: ctx.modelGateway
    description: 模型目录/渠道组降级链/预算熔断/遥测（REST 面由 console 聚合暴露）
