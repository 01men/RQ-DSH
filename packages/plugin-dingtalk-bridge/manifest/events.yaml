# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点
plugin: dsh-plugin-dingtalk-bridge
events:
  - name: panel.message.created
    mode: subscribe
    description: 面板消息（ddSync）→ 钉钉群投递
  - name: audit.alert.fired
    mode: subscribe
    description: 告警 channels 含 dingtalk → 坐实投递（补齐仓库欠账）
  - name: dingtalk-bridge.delivered
    mode: emit
    description: 投递回执（面板订阅更新 ddSync 状态）
