# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点
plugin: dsh-plugin-panel-core
events:
  - name: panel.message.created
    mode: emit
    description: 面板消息产生（钉钉桥接订阅做同步投递；SSE 推流）
  - name: panel.card.action
    mode: emit
    description: Agent 操作卡片按钮动作（任务落点/审批链）
  - name: panel.task.updated
    mode: emit
    description: 任务泳道迁移（看板实时刷新）
  - name: panel.industry.activated
    mode: emit
    description: 行业授权激活完成（面板解锁行业图谱）
  - name: scenegraph.updated
    mode: subscribe
    description: 图谱热刷新 → 面板场景页失效重载
  - name: dingtalk-bridge.delivered
    mode: subscribe
    description: 钉钉投递回执 → 消息 ddSync 状态更新
