# 插件声明：id、版本、依赖与权限点（插件标准解剖结构）
id: dsh-plugin-connector
version: 1.1.0
label: SaaS 连接器纳管
depends: ['dsh-plugin-platform-core', 'dsh-plugin-iam', 'dsh-plugin-audit', 'dsh-plugin-usage', 'dsh-plugin-billing']
provides:
  services:
    - connectorHub
permissions:
  - connector.gateway.write
