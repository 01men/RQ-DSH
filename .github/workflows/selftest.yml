# 榕器 ybkk-AIOS 质量闸门（OPT-P3-01）：契约 lint + 定时器卫生 + 全量自测 + P95 尾延迟
# P95 阈值键（可按机器性能经环境覆盖）：
#   P95_GATE_LOGIN_MS    登录换票 P95 上限（默认 800ms）
#   P95_GATE_INVOKE_MS   connector invoke P95 上限（默认 1500ms）
name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      P95_GATE_LOGIN_MS: '800'
      P95_GATE_INVOKE_MS: '1500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract lint (manifests ↔ implementation)
        run: npm run lint:manifests
      - name: Selftest (1085+ assertions incl. P95 gate & fault injection)
        run: npm run selftest
