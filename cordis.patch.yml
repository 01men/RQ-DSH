# cordis.patch.yml —— dsh.bundle 安装补丁（dsh plugin add github:01men/ybkk-AIOS）。
#
# 与 cordis.yml 的区别：
#   - cordis.yml       面向本仓库源码检出，name 为替换 <PROJECT_ROOT> 后的 file:// 绝对路径（--patch overlay）
#   - cordis.patch.yml 面向 `dsh plugin add` 安装场景，name 为「包名 + 子路径」模块说明符：
#                      Node 从 profile 目录出发沿 node_modules 解析（本包被 pnpm 安装在
#                      <profile>/node_modules/dsh-enterprise-ops，向上还有 $DSH_HOME/profiles/node_modules
#                      扁平回退层），因此无需感知安装位置，开箱可解析。
#                      ⚠ 不要写 ./packages/... 相对路径——loader 以 profile 目录（而非本包根）为基准
#                      解析相对路径，而本包的 packages/ 不在 profile 根下；该写法曾导致全部 entry
#                      ERR_MODULE_NOT_FOUND、整棵插件树加载失败。
#
# 行为与 cordis.yml 一致：
#   - provideToolRuntime=false：复用 dsh 原生 ToolRuntime（服务键 tools），
#     平台插件注册的全部运维工具将直接进入 dsh 工具注册表、对模型可见、可被调用
#   - startHttp=false：控制台 SPA 仍由独立进程提供（node src/main.ts），
#     两个进程共享同一 data/ 目录即可管理同一份数据
- insert:
    - id: ops-platform-core
      name: dsh-enterprise-ops/packages/platform-core/src/index.ts
      config:
        provideToolRuntime: false
        startHttp: false
    # connect 必须先于业务插件加载：client 角色要在业务工具注册前完成代理包裹。
    # 安装后自动向宿主申请口令的三条通道：
    #   1. dsh 界面对 Agent 说「接入宿主 <地址>，接入码 <enr_…>」→ connect_setup
    #   2. 浏览器打开本机配置页 http://127.0.0.1:7390 可视化填写/更新
    #   3. 已有机器凭证时 connect_login 直接配置
    - id: ops-connect
      name: dsh-enterprise-ops/packages/plugin-connect/src/index.ts
      config:
        role: client
    - id: ops-resource-core
      name: dsh-enterprise-ops/packages/plugin-resource-core/src/index.ts
    - id: ops-iam
      name: dsh-enterprise-ops/packages/plugin-iam/src/index.ts
    - id: ops-authn
      name: dsh-enterprise-ops/packages/plugin-authn/src/index.ts
    - id: ops-usage
      name: dsh-enterprise-ops/packages/plugin-usage/src/index.ts
    - id: ops-billing
      name: dsh-enterprise-ops/packages/plugin-billing/src/index.ts
    - id: ops-audit
      name: dsh-enterprise-ops/packages/plugin-audit/src/index.ts
    - id: ops-market
      name: dsh-enterprise-ops/packages/plugin-market/src/index.ts
    # 连接器纳管（open-connector 数据面网关适配）：依赖 iam/usage/billing/audit，先于 mcp/modelgw
    - id: ops-connector
      name: dsh-enterprise-ops/packages/plugin-connector/src/index.ts
    - id: ops-mcp
      name: dsh-enterprise-ops/packages/plugin-mcp/src/index.ts
    # NAS（FS 文件存储）资产：先于 skillhub 加载（skillhub 上架时经 nasRegistry 上传 skill.zip）
    - id: ops-nas
      name: dsh-enterprise-ops/packages/plugin-nas/src/index.ts
    - id: ops-skillhub
      name: dsh-enterprise-ops/packages/plugin-skillhub/src/index.ts
    - id: ops-agent
      name: dsh-enterprise-ops/packages/plugin-agent/src/index.ts
    - id: ops-app
      name: dsh-enterprise-ops/packages/plugin-app/src/index.ts
    - id: ops-modelgw
      name: dsh-enterprise-ops/packages/plugin-modelgw/src/index.ts
    # 平台自更新：上游版本检查 + Agent 工具（发现新版本提示升级，source 形态可一键执行）
    - id: ops-update
      name: dsh-enterprise-ops/packages/plugin-update/src/index.ts
