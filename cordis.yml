# cordis.yml —— 把本平台的插件树挂载进完整 dsh 运行时（dsh web / dsh headless）。
#
# 用法（在 deepseek-harness 源码检出中，两步缺一不可）：
#   1) 先把本项目 node_modules/@deepseek-ai/cordis 链接到 dsh 源码树的 vendor/cordis
#      （junction），保证插件与宿主是同一个 cordis 实例——两份实例会让服务链
#      （iam→usage→audit…）全部 pending，详见 README「一份插件代码，两种宿主」
#   2) pnpm dsh web --patch <本项目绝对路径>/cordis.yml
#
# 说明：
#   - <PROJECT_ROOT> 需替换为 file:// URL 形式的绝对路径（Windows 下裸盘符路径会被
#     ESM 判为 ERR_UNSUPPORTED_ESM_URL_SCHEME），例如 file:///D:/mycode/ybkk-AIOS
#     （路径含中文等非 ASCII 字符时用百分号编码）
#   - provideToolRuntime=false：完整 dsh 自带 ToolRuntime（ctx.tools），
#     平台插件注册的全部运维工具将直接对模型可见、可被调用
#   - startHttp=false + plugin-dsh-bridge：榕器数据面（REST/控制台 SPA/docs/mcp）
#     以 /rq 前缀挂进 dsh webServer——单进程单入口（dsh web 端口即唯一入口），
#     独立进程形态（node src/main.ts）保留为开发形态，两种形态不再要求并跑
- insert:
    - id: ops-platform-core
      name: '<PROJECT_ROOT>/packages/platform-core/src/index.ts'
      config:
        provideToolRuntime: false
        startHttp: false
        http:
          # 对外前缀：OIDC 授权页 302 等「根绝对路径」构造据此保持 /rq 自洽
          externalBase: /rq
    # connect 必须先于业务插件加载：client 角色要在业务工具注册前完成代理包裹
    - id: ops-connect
      name: '<PROJECT_ROOT>/packages/plugin-connect/src/index.ts'
      config:
        role: client
    - id: ops-resource-core
      name: '<PROJECT_ROOT>/packages/plugin-resource-core/src/index.ts'
    - id: ops-iam
      name: '<PROJECT_ROOT>/packages/plugin-iam/src/index.ts'
    - id: ops-authn
      name: '<PROJECT_ROOT>/packages/plugin-authn/src/index.ts'
    - id: ops-usage
      name: '<PROJECT_ROOT>/packages/plugin-usage/src/index.ts'
    - id: ops-billing
      name: '<PROJECT_ROOT>/packages/plugin-billing/src/index.ts'
    - id: ops-audit
      name: '<PROJECT_ROOT>/packages/plugin-audit/src/index.ts'
    - id: ops-market
      name: '<PROJECT_ROOT>/packages/plugin-market/src/index.ts'
    # 连接器纳管（open-connector 数据面网关适配）：依赖 iam/usage/billing/audit，先于 mcp/modelgw
    - id: ops-connector
      name: '<PROJECT_ROOT>/packages/plugin-connector/src/index.ts'
    - id: ops-mcp
      name: '<PROJECT_ROOT>/packages/plugin-mcp/src/index.ts'
    # NAS（FS 文件存储）资产：先于 skillhub 加载（skillhub 上架时经 nasRegistry 上传 skill.zip）
    - id: ops-nas
      name: '<PROJECT_ROOT>/packages/plugin-nas/src/index.ts'
    - id: ops-skillhub
      name: '<PROJECT_ROOT>/packages/plugin-skillhub/src/index.ts'
    - id: ops-agent
      name: '<PROJECT_ROOT>/packages/plugin-agent/src/index.ts'
    - id: ops-app
      name: '<PROJECT_ROOT>/packages/plugin-app/src/index.ts'
    - id: ops-modelgw
      name: '<PROJECT_ROOT>/packages/plugin-modelgw/src/index.ts'
    # 平台自更新：上游版本检查 + Agent 工具（update_status/update_check/update_apply）
    - id: ops-update
      name: '<PROJECT_ROOT>/packages/plugin-update/src/index.ts'
    # 门户数据通道（公开只读拉取端点）：必须先于 console 装配——在其鉴权中间件之前截获 /api/portal/*
    - id: ops-portal
      name: '<PROJECT_ROOT>/packages/plugin-portal/src/index.ts'
    # 控制台 REST 网关 + SPA（Bearer 鉴权/工具桥/MCP 端点/静态托管）
    - id: ops-console
      name: '<PROJECT_ROOT>/packages/plugin-console/src/index.ts'
    # 单进程单入口：把榕器数据面挂进 dsh webServer（/rq 前缀），必须在 console 之后装配
    - id: ops-dsh-bridge
      name: '<PROJECT_ROOT>/packages/plugin-dsh-bridge/src/index.ts'
      config:
        mountPath: /rq
    # 会话侧注入插件（WP-06）：四态执行卡 + 👍/👎 反馈条（dsh.client 双面插件）。
    # name 必须写包名而非源码路径：client-modules 用 require.resolve('<条目>/package.json')
    # 解析包元数据，文件路径会被负判为「非 client 包」且永久缓存（spike §4.2）。
    # 启动前必须先构建浏览器半（激活期缺 bundle 会响亮抛错、宿主启动失败，spike §4.4）：
    #   node packages/plugin-rq-card/build.mjs   →  packages/plugin-rq-card/lib/client.js
    - id: rq-card
      name: '@dsh-ops/plugin-rq-card'
